glob_matcher: doublestar

pre-commit:
  piped: true
  jobs:
    # Format first and alone, so later jobs never read files mid-rewrite.
    - name: format
      glob: "**/*.{js,jsx,ts,tsx,json,jsonc,mjs,cjs}"
      run: bunx biome format --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - group:
        parallel: true
        jobs:
          - name: lint-code
            glob: "**/*.{js,jsx,ts,tsx,json,jsonc,mjs,cjs}"
            run: bunx biome check --formatter-enabled=false --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
          - name: typecheck
            glob:
              - "**/*.{ts,tsx,mjs}"
              - "tsconfig.json"
              - "package.json"
            run: bun run typecheck
          - name: markdownlint
            glob: "docs/**/*.{md,mdx}"
            run: bunx markdownlint-cli2 --no-globs {staged_files}
          - name: check-docs
            glob:
              - "{docs,src}/**/*"
              - "tools/check/docs.ts"
            run: bun run check:docs
          - name: check-examples
            glob:
              - "docs/**/*.{md,mdx}"
              - "tools/check/examples.ts"
              - "biome.json"
              - "tools/lint/*"
            run: bun run check:examples
          - name: schemas-check
            glob: "{schemas,tools/schemas}/**/*"
            run: bun run schemas:check

pre-push:
  jobs:
    - name: verify-locked
      run: bun run verify:locked
