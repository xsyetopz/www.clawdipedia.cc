name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A pull request run is cancelled by the next push to it. A main run is not, because it deploys.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just@1.59.0
      - name: Setup
        run: just setup setup-project
      - name: Verify
        run: just verify
      # check:citations reads the build of src/version.ts from ~/.local/share/claude/versions.
      # The docs cite the darwin-arm64 build; other platforms have other chunk names. The step only reads it.
      - name: Download the tracked Claude Code build
        run: |
          v=$(bun -e 'console.log((await import("./src/version.ts")).CLAUDE_CODE_VERSION)')
          base="https://downloads.claude.ai/claude-code-releases/$v"
          dir="$HOME/.local/share/claude/versions"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/$v" "$base/darwin-arm64/claude"
          sum=$(curl -fsSL "$base/manifest.json" | jq -r '.platforms["darwin-arm64"].checksum')
          echo "$sum  $dir/$v" | sha256sum -c -
      - name: Site checks
        run: just verify-project
      # Every step above must pass before this one runs, so a failed check stops the deploy.
      # A pull request never reaches it. See the Deploy section of README.md.
      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
