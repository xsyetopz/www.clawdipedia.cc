name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A pull request run is cancelled by the next push to it. A main run is not, because it deploys.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install plugin server dependencies
        run: |
          bun install --cwd plugin/mcp --frozen-lockfile
          bun install --cwd inspect/mcp --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Format
        run: bun run format:check
      - name: Lint code
        run: bun run lint:code
      - name: Lint markdown
        run: bun run lint
      - name: Docs check
        run: bun run check:docs
      - name: Schemas check
        run: bun run schemas:check
      - name: Build
        run: bun run build
      - name: Llms check
        run: bun run llms:check
      - name: Plugin check
        run: bun run plugin:check
      - name: Deploy config check
        run: bun run deploy:check
      # Every step above must pass before this one runs, so a failed check stops the deploy.
      # A pull request never reaches it. See the Deploy section of README.md.
      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
